<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ Streak الإمبراطوري للمذاكرة 👑</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --gold-accent: #d4af37;
            --gold-glow: #f39c12;
            --text-color: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #05070c 0%, #111827 50%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        .crown-main { font-size: 3.5rem; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6)); }
        h1 { color: var(--gold-accent); margin: 0 0 10px 0; font-size: 2.2rem; text-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }

        .timer-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            backdrop-filter: blur(8px);
        }

        .cards-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }

        .user-card {
            background: var(--card-bg);
            border: 2px solid var(--gold-accent);
            border-radius: 20px;
            padding: 25px 20px;
            width: 300px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .card-icon { font-size: 2.8rem; text-align: center; margin-bottom: 5px; }
        .user-card h2 { text-align: center; margin: 0 0 10px 0; font-size: 1.6rem; }
        .streak-num { font-size: 2.6rem; font-weight: bold; color: var(--gold-glow); text-align: center; margin: 10px 0; }

        input, textarea, button {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
            border: 1px solid #334155; background: rgba(15, 23, 42, 0.8);
            color: white; box-sizing: border-box; font-family: inherit;
        }

        button {
            background: linear-gradient(45deg, #d4af37, #f39c12);
            color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 12px;
        }

        .status-done {
            color: #4ade80; font-weight: bold; text-align: center; padding: 8px;
            background: rgba(74, 222, 128, 0.1); border-radius: 8px; border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .proof-text {
            background: rgba(15, 23, 42, 0.9); padding: 12px; border-radius: 8px;
            font-size: 0.9rem; word-break: break-all; border-right: 3px solid var(--gold-accent);
        }
    </style>

    <!-- Firebase SDK Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <div class="crown-main">👑</div>
        <h1>تحدي الـ Streak الإمبراطوري للمذاكرة</h1>
        <div id="timer" class="timer-box">جاري حساب الوقت المتبقي...</div>
    </header>

    <main class="cards-container" id="cardsContainer"></main>

    <script>
        // إعدادات مشروعك في Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBrLwyl_kKN4Zq4PQ6JFTFKc4NAdDmR8RY",
            authDomain: "yariyah-streak.firebaseapp.com",
            databaseURL: "https://yariyah-streak-default-rtdb.firebaseio.com",
            projectId: "yariyah-streak",
            storageBucket: "yariyah-streak.firebasestorage.app",
            messagingSenderId: "585593636126",
            appId: "1:585593636126:web:73816052f9ab937fb9b50f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const users = [
            { id: "user1", name: "الإمبراطور", icon: "👑" },
            { id: "user2", name: "الإمبراطورة", icon: "👸" },
            { id: "user3", name: "السلطانة", icon: "⚜️" }
        ];

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function getYesterday() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toISOString().split('T')[0];
        }

        database.ref('usersData').on('value', (snapshot) => {
            const cloudData = snapshot.val() || {};
            renderUI(cloudData);
        });

        function renderUI(cloudData) {
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";
            const today = getToday();
            const yesterday = getYesterday();

            users.forEach(user => {
                const uData = cloudData[user.id] || {};
                let streak = uData.streak || 0;
                let lastDate = uData.lastDate || "";
                let pass = uData.pass || "";
                let proof = uData.proof || "";

                if (lastDate && lastDate !== today && lastDate !== yesterday && streak > 0) {
                    streak = 0;
                    database.ref(`usersData/${user.id}/streak`).set(0);
                }

                const isDoneToday = (lastDate === today);
                const card = document.createElement("div");
                card.className = "user-card";

                if (isDoneToday) {
                    card.innerHTML = `
                        <div class="card-icon">${user.icon}</div>
                        <h2>${user.name}</h2>
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        <div class="status-done">✅ تم إنجاز المذاكرة الملكية اليوم!</div>
                        <p style="font-size:0.85rem; margin-top:12px; color:var(--gold-accent);">إثبات الإنجاز:</p>
                        <div class="proof-text">${proof}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="card-icon">${user.icon}</div>
                        <h2>${user.name}</h2>
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        <input type="password" id="pass_${user.id}" placeholder="كلمة السر الخاصة بك">
                        <textarea id="proof_${user.id}" placeholder="إثبات المذاكرة (ماذا أنجزت اليوم؟)..."></textarea>
                        <button onclick="checkIn('${user.id}', '${pass}', ${streak})">تسجيل المذاكرة اليوم</button>
                    `;
                }
                container.appendChild(card);
            });
        }

        function checkIn(userId, savedPass, currentStreak) {
            const passInput = document.getElementById(`pass_${userId}`).value;
            const proofInput = document.getElementById(`proof_${userId}`).value.trim();

            if (!passInput) {
                alert("أدخل كلمة السر الخاصة بك!");
                return;
            }

            if (!savedPass) {
                database.ref(`usersData/${userId}/pass`).set(passInput);
            } else if (savedPass !== passInput) {
                alert("كلمة السر خاطئة!");
                return;
            }

            if (!proofInput) {
                alert("اكتب دليل المذاكرة أولاً!");
                return;
            }

            const today = getToday();

            database.ref(`usersData/${userId}`).update({
                streak: currentStreak + 1,
                lastDate: today,
                proof: proofInput
            });

            alert("كفو! تم تسجيل المذاكرة واحتساب الـ Streak السحابي الملكي 🔥👑");
        }

        function startMidnightTimer() {
            function update() {
                const now = new Date();
                const midnight = new Date();
                midnight.setHours(24, 0, 0, 0);

                const diff = midnight - now;
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("timer").innerText = 
                    `الوقت المتبقي لانتهاء اليوم: ${hours}س : ${mins}د : ${secs}ث`;
            }
            update();
            setInterval(update, 1000);
        }

        startMidnightTimer();
    </script>
</body>
</html>
