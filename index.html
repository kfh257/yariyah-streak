<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ Streak الإمبراطوري للمذاكرة 👑</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 46, 0.85);
            --gold-accent: #d4af37;
            --gold-glow: #f39c12;
            --text-color: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #05070c 0%, #111827 50%, #1e1b4b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        .crown-main { font-size: 3.5rem; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6)); }
        h1 { color: var(--gold-accent); margin: 0 0 10px 0; font-size: 2.2rem; text-shadow: 0 0 12px rgba(212, 175, 55, 0.4); }

        .timer-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            backdrop-filter: blur(8px);
        }

        .cards-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
        }

        .user-card {
            background: var(--card-bg);
            border: 2px solid var(--gold-accent);
            border-radius: 20px;
            padding: 25px 20px;
            width: 320px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }

        .card-icon { font-size: 2.8rem; text-align: center; margin-bottom: 5px; }
        .user-card h2 { text-align: center; margin: 0 0 10px 0; font-size: 1.6rem; }
        .streak-num { font-size: 2.6rem; font-weight: bold; color: var(--gold-glow); text-align: center; margin: 10px 0; }

        input, textarea, button {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px;
            border: 1px solid #334155; background: rgba(15, 23, 42, 0.8);
            color: white; box-sizing: border-box; font-family: inherit;
        }

        button {
            background: linear-gradient(45deg, #d4af37, #f39c12);
            color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 12px;
        }

        .status-done {
            color: #4ade80; font-weight: bold; text-align: center; padding: 8px;
            background: rgba(74, 222, 128, 0.1); border-radius: 8px; border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .proof-text {
            background: rgba(15, 23, 42, 0.9); padding: 12px; border-radius: 8px;
            font-size: 0.9rem; word-break: break-all; border-right: 3px solid var(--gold-accent);
        }

        .punishment-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .reset-all-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #fca5a5;
            margin-top: 40px;
            padding: 8px 16px;
            font-size: 0.8rem;
            width: auto;
            border-radius: 20px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
        }
        .reset-all-btn:hover { opacity: 1; background: rgba(239, 68, 68, 0.2); }
    </style>

    <!-- Firebase SDK Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <div class="crown-main">👑</div>
        <h1>تحدي الـ Streak الإمبراطوري للمذاكرة</h1>
        <div id="timer" class="timer-box">جاري حساب الوقت المتبقي...</div>
    </header>

    <main class="cards-container" id="cardsContainer"></main>

    <button class="reset-all-btn" onclick="resetAllData()">⚙️ بداية تحدي جديد (تصفير الكل)</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrLwyl_kKN4Zq4PQ6JFTFKc4NAdDmR8RY",
            authDomain: "yariyah-streak.firebaseapp.com",
            databaseURL: "https://yariyah-streak-default-rtdb.firebaseio.com",
            projectId: "yariyah-streak",
            storageBucket: "yariyah-streak.firebasestorage.app",
            messagingSenderId: "585593636126",
            appId: "1:585593636126:web:73816052f9ab937fb9b50f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // قائمة المستخدمين
        const users = [
            { id: "user1", name: "الإمبراطور", icon: "👑" },
            { id: "user2", name: "الإمبراطورة", icon: "👸" }
        ];

        // قائمة عقابات خفيفة عند تفويت يوم
        const punishments = [
            "⚠️ عقاب تفويت اليوم: اشرب كاسين موية باردة دفعة واحدة للتركيز! 💧",
            "⚠️ عقاب تفويت اليوم: سوي 10 ضغطات أو 15 سكوات لتجديد طاقتك! 🏋️‍♂️",
            "⚠️ عقاب تفويت اليوم: ابعد الجوال عنك تماماً لمدة ساعة أثناء المذاكرة 📱❌",
            "⚠️ عقاب تفويت اليوم: رتب مكتبك ومكان مذاكرتك بالكامل قبل البدء 🧹✨",
            "⚠️ عقاب تفويت اليوم: ادرس أول 25 دقيقة اليوم بدون أي استراحة أو تشتت ⏱️🔥",
            "⚠️ عقاب تفويت اليوم: اكتب هدفك الأكاديمي الكبير في ورقة وثبتها قدامك 📝👑",
            "⚠️ عقاب تفويت اليوم: تمشّى بالمكان لمدة 3 دقائق واغسل وجهك بموية باردة 🧊",
            "⚠️ عقاب تفويت اليوم: اترك أي مشروب سكري لليوم واكتفِ بالموية أو القهوة السادة ☕",
            "⚠️ عقاب تفويت اليوم: اكتب قائمة بأهم 3 مهام تحتاجهما اليوم وانجزهم بالترتيب 📋",
            "⚠️ عقاب تفويت اليوم: سوي تمارين إطالة (استطالة) لظهرك ورقبتك قبل تبدأ 🧘‍♂️",
            "⚠️ عقاب تفويت اليوم: ادرس لـ 45 دقيقة متواصلة بدون وضع الطيران بالجوال ✈️",
            "⚠️ عقاب تفويت اليوم: جهّز كوب ماتشا أو شاهي ملكي وركّز في درسك الحالي 🍵👑"
        ];

        // قائمة عبارات تحفيزية متغيرة
        const motivations = [
            "كفووو! الملوك لا يتراجعون، إنجاز مذهل اليوم! 🔥👑",
            "استمراريتك هي سر عظمتك.. استمر في التماسك! ✨⚔️",
            "يوم جديد وإنجاز جديد يُضاف لإمبراطوريتك! 🏆💯",
            "عاش! خطوات صغيرة يومياً تصنع الفارق الكبير! 🚀📚",
            "الالتزام هو الفارق بين العادي والإمبراطوري! كفو عليك 🔥👑",
            "فخورين فيك! المذاكرة اليوم أصبحت في الجيب 🎓🌟",
            "قوة، تركيز، وإرادة سليمانية! واصل التحدي 💪🔥",
            "سلسلة الـ Streak تستمر في الاشتعال! لا أحد يوقفك اليوم ⚡️👑",
            "الإصرار يصنع المستحيل.. خطوة إمبراطورية جديدة بنجاح! 👑🎯",
            "بطل! الانضباط هو الجسر بين أهدافك وإنجازاتك 🌉✨",
            "عظمة على عظمة! المذاكرة اليوم تمت بأعلى مستوى 🔥📖",
            "يوم آخر من الإنجاز يثبت أنك قد التحدي وبجدارة! 🏅🌟",
            "كفو والله! التركيز والالتزام سمة الكبار دائماً 👑💪",
            "استمر، الثمار القادمة ستكون أكبر من كل التوقعات! 🌳💎",
            "مذهل! طاقة إيجابية وإنجاز يدرّس لليوم 🚀✨",
            "ما شاء الله عليك! تثبت يومياً أن المستحيل كلمة غير موجودة بقاموسك 🔥👑"
        ];

        function getToday() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getYesterday() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        database.ref('usersData').on('value', (snapshot) => {
            const cloudData = snapshot.val() || {};
            renderUI(cloudData);
        });

        function renderUI(cloudData) {
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";
            const today = getToday();
            const yesterday = getYesterday();

            users.forEach(user => {
                const uData = cloudData[user.id] || {};
                let streak = uData.streak || 0;
                let lastDate = uData.lastDate || "";
                let pass = uData.pass || "";
                let proof = uData.proof || "";
                let wasReset = false;

                if (lastDate && lastDate !== today && lastDate !== yesterday && streak > 0) {
                    streak = 0;
                    wasReset = true;
                    database.ref(`usersData/${user.id}/streak`).set(0);
                }

                const isDoneToday = (lastDate === today);
                const card = document.createElement("div");
                card.className = "user-card";

                if (isDoneToday) {
                    card.innerHTML = `
                        <div class="card-icon">${user.icon}</div>
                        ` + "<h2>" + user.name + "</h2>" + `
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        <div class="status-done">✅ تم إنجاز المذاكرة الملكية اليوم!</div>
                        <p style="font-size:0.85rem; margin-top:12px; color:var(--gold-accent);">إثبات الإنجاز:</p>
                        <div class="proof-text">${proof}</div>
                    `;
                } else {
                    const randomPunishment = punishments[Math.floor(Math.random() * punishments.length)];
                    const punishmentHTML = (wasReset || (lastDate && lastDate !== today && lastDate !== yesterday)) 
                        ? `<div class="punishment-box">${randomPunishment}</div>` 
                        : '';

                    card.innerHTML = `
                        <div class="card-icon">${user.icon}</div>
                        ` + "<h2>" + user.name + "</h2>" + `
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        ${punishmentHTML}
                        <input type="password" id="pass_${user.id}" placeholder="كلمة السر الخاصة بك">
                        <textarea id="proof_${user.id}" placeholder="إثبات المذاكرة (ماذا أنجزت اليوم؟)..."></textarea>
                        <button onclick="checkIn('${user.id}', '${pass}', ${streak})">تسجيل المذاكرة اليوم</button>
                    `;
                }
                container.appendChild(card);
            });
        }

        function checkIn(userId, savedPass, currentStreak) {
            const passInput = document.getElementById(`pass_${userId}`).value;
            const proofInput = document.getElementById(`proof_${userId}`).value.trim();

            if (!passInput) {
                alert("أدخل كلمة السر الخاصة بك!");
                return;
            }

            if (!savedPass) {
                database.ref(`usersData/${userId}/pass`).set(passInput);
            } else if (savedPass !== passInput) {
                alert("كلمة السر خاطئة!");
                return;
            }

            if (!proofInput) {
                alert("اكتب دليل المذاكرة أولاً!");
                return;
            }

            const today = getToday();
            const randomMotivation = motivations[Math.floor(Math.random() * motivations.length)];

            database.ref(`usersData/${userId}`).update({
                streak: currentStreak + 1,
                lastDate: today,
                proof: proofInput
            });

            alert(`${randomMotivation}\n\nتم تسجيل الإنجاز واحتساب الـ Streak! 🎉👑`);
        }

        // دالة التصفير الشامل للجميع
        function resetAllData() {
            if (confirm("هل أنت تأكد من إرجاع كافة الستريكات للصفر والبدء من جديد؟")) {
                database.ref('usersData').remove().then(() => {
                    alert("تم تصفير جميع الستريكات والبدء من جديد بنجاح! 🚀👑");
                });
            }
        }

        function startMidnightTimer() {
            function update() {
                const now = new Date();
                const midnight = new Date();
                midnight.setHours(24, 0, 0, 0);

                const diff = midnight - now;
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("timer").innerText = 
                    `الوقت المتبقي لانتهاء اليوم: ${hours}س : ${mins}د : ${secs}ث`;
            }
            update();
            setInterval(update, 1000);
        }

        startMidnightTimer();
    </script>
</body>
</html>
