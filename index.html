<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعقب السلسلة - Study Streak Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      /* خلفية خيالية لقلعة فرسان ملكية وخيول */
      background: linear-gradient(rgba(18, 12, 31, 0.75), rgba(18, 12, 31, 0.85)),
                  url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    .container {
      background: rgba(30, 22, 48, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.2);
      text-align: center;
    }

    h1 {
      color: #f1c40f;
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(241, 196, 15, 0.4);
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .streak-display {
      font-size: 3rem;
      font-weight: bold;
      color: #ff7675;
      margin: 10px 0;
      text-shadow: 0 0 15px rgba(255, 118, 117, 0.5);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-main {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      padding: 12px 24px;
      font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
    }

    .btn-adjust {
      background: rgba(255, 255, 255, 0.15);
      color: #ffeaa7;
      width: 40px;
      height: 40px;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 234, 167, 0.3);
    }

    .btn-adjust:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    .reward-box {
      margin-top: 20px;
      background: linear-gradient(135deg, rgba(253, 121, 168, 0.2), rgba(225, 112, 85, 0.2));
      border: 1px dashed #fd79a8;
      border-radius: 16px;
      padding: 15px;
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .reward-box h3 {
      color: #fd79a8;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .reward-box p {
      color: #ffeaa7;
      font-size: 1rem;
      font-weight: 600;
    }

    .motto {
      margin-top: 25px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #ff7675;
      text-shadow: 0 2px 10px rgba(255, 118, 117, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚔️ تعقب السلسلة - Study Streak ⚔️</h1>

    <div class="card">
      <h2>أيام الالتزام المتواصلة</h2>
      <div class="streak-display" id="streakCount">0</div>

      <button class="btn-main" onclick="checkIn()">تسجيل حضور اليوم ⚡</button>

      <!-- أزرار تعديل الأيام يدوياً -->
      <div class="controls">
        <button class="btn-adjust" onclick="adjustStreak(-1)">-</button>
        <span style="font-size: 0.9rem; color: #dcdde1;">تعديل الأيام</span>
        <button class="btn-adjust" onclick="adjustStreak(1)">+</button>
      </div>
    </div>

    <!-- صندوق عرض المكافأة كل 5 أيام -->
    <div class="reward-box" id="rewardBox">
      <h3>👑 مكافأة إنجاز الـ 5 أيام! 👑</h3>
      <p id="rewardText"></p>
    </div>

    <!-- العبارة التشجيعية الكبيرة -->
    <div class="motto">
      استمري يوري يا بطله 💖✨
    </div>
  </div>

  <script>
    // قائمة الـ 15 مكافأة المتنوعة واللطيفة (بدون التركيز على الشراء)
    const rewards = [
      "🍵 اطلبي مشروبك المفضّل (ماتشا دافئة أو باردة) واستمتعي بها!",
      "💅 وقت الدلال: حطي مناكير بلونك المفضّل اليوم!",
      "🎧 استمعي لبودكاست لطيف أو قائمة أغانيك المفضلة لمدة 20 دقيقة.",
      "🍰 خذي استراحة واستمتعي بقطعة حلى تحبينها.",
      "📖 اقرئي فصلًا واحدًا من كتابك أو روايتك المفضلة.",
      "🕯️ ولّعي شمعة معطرة واسترخي لمدة 15 دقيقة في جو هادئ.",
      "🧖‍♀️ ماسك سريع للوجه مع عناية بالبشرة واستجداء للهدوء.",
      "🎬 شادي حلقة من مسلسلك المفضّل بدون أي شعور بالذنب!",
      "🚶‍♀️️ خذي جولة مشي قصيرة ولطيفة في الهواء الطلق مع مشروب هادئ.",
      "✏️ ارسمي أو لوني أو مارسي هواية فنية تحبينها.",
      "🌸 كافئي نفسك بورود طبيعية جميلة تزين غرفتك.",
      "💆‍♀️ اعملي مساج خفيف للكتفين أو اليدين مع زيت معطر.",
      "😴 خذي قيلولة خفيفة لملاقاة طاقة جديدة (30 دقيقة).",
      "📞 مكالمة لطيفة مع صديقتك المفضلة لتبادل السوالف الممتعة.",
      "✨ جربي تسريحة شعر جديدة ولطيفة تحسين فيها بالتغيير والجمال!"
    ];

    let currentStreak = parseInt(localStorage.getItem('userStreak')) || 0;
    document.getElementById('streakCount').innerText = currentStreak;

    function updateDisplay() {
      document.getElementById('streakCount').innerText = currentStreak;
      localStorage.setItem('userStreak', currentStreak);
      checkReward();
    }

    function checkIn() {
      currentStreak++;
      updateDisplay();
    }

    function adjustStreak(amount) {
      currentStreak += amount;
      if (currentStreak < 0) currentStreak = 0;
      updateDisplay();
    }

    function checkReward() {
      const rewardBox = document.getElementById('rewardBox');
      const rewardText = document.getElementById('rewardText');

      // تظهر المكافأة إذا كان العداد أعلى من 0 ومضاعفاً للرقم 5
      if (currentStreak > 0 && currentStreak % 5 === 0) {
        // اختيار مكافأة عشوائية بناءً على العداد
        const selectedReward = rewards[(currentStreak / 5 - 1) % rewards.length];
        rewardText.innerText = selectedReward;
        rewardBox.style.display = 'block';
      } else {
        rewardBox.style.display = 'none';
      }
    }

    // التحقق عند تحميل الصفحة
    checkReward();
  </script>
</body>
</html>
