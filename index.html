<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الـ Streak للمذاكرة 📚</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --text: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: var(--accent); margin-bottom: 10px; }

        .timer-box {
            background: #334155;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }

        .user-card {
            background: var(--card-bg);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            box-sizing: border-box;
        }

        .streak-num {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f59e0b;
            text-align: center;
            margin: 10px 0;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:hover { opacity: 0.9; }
        .status-done { color: var(--accent); font-weight: bold; text-align: center; }
        .proof-text { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 0.85rem; word-break: break-all; }
    </style>
</head>
<body>

    <header>
        <h1>🔥 تحدي المذاكرة اليومي</h1>
        <div id="timer" class="timer-box">جاري حساب الوقت المتبقي...</div>
    </header>

    <main class="cards-container" id="cardsContainer"></main>

    <script>
        // قائمة الأشخاص الـ 3 (تقدر تغير الأسماء هنا)
        const users = [
            { id: "user1", name: "المستخدم 1" },
            { id: "user2", name: "المستخدم 2" },
            { id: "user3", name: "المستخدم 3" }
        ];

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function getYesterday() {
            const d = new Date();
            d.setDate(d.getDate() - 1);
            return d.toISOString().split('T')[0];
        }

        // فحص وتصفير الـ Streak عند تفويت يوم (12 بالليل)
        function verifyStreaks() {
            const today = getToday();
            const yesterday = getYesterday();

            users.forEach(u => {
                let lastDate = localStorage.getItem(`${u.id}_last_date`);
                if (lastDate && lastDate !== today && lastDate !== yesterday) {
                    localStorage.setItem(`${u.id}_streak`, 0);
                }
            });
        }

        // بناء الواجهة
        function renderUI() {
            verifyStreaks();
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";
            const today = getToday();

            users.forEach(user => {
                const streak = localStorage.getItem(`${user.id}_streak`) || 0;
                const lastDate = localStorage.getItem(`${user.id}_last_date`);
                const isDoneToday = (lastDate === today);
                const savedProof = localStorage.getItem(`${user.id}_proof_${today}`) || "";

                const card = document.createElement("div");
                card.className = "user-card";

                if (isDoneToday) {
                    card.innerHTML = `
                        <h2 style="text-align:center;">${user.name}</h2>
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        <div class="status-done">✅ تم تسجيل المذاكرة اليوم!</div>
                        <p style="font-size:0.8rem; margin-top:10px;">دليل المذاكرة:</p>
                        <div class="proof-text">${savedProof}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <h2 style="text-align:center;">${user.name}</h2>
                        <div class="streak-num">🔥 ${streak} يوم</div>
                        <input type="password" id="pass_${user.id}" placeholder="كلمة السر الخاصة بك">
                        <textarea id="proof_${user.id}" placeholder="إثبات المذاكرة (وش ذاكرت اليوم؟)..."></textarea>
                        <button onclick="checkIn('${user.id}')">تسجيل دخول اليوم</button>
                    `;
                }
                container.appendChild(card);
            });
        }

        // تسجيل الدخول والـ Streak
        function checkIn(userId) {
            const passInput = document.getElementById(`pass_${userId}`).value;
            const proofInput = document.getElementById(`proof_${userId}`).value.trim();

            if (!passInput) {
                alert("أدخل كلمة السر الخاصة بك!");
                return;
            }

            let savedPass = localStorage.getItem(`${userId}_pass`);
            if (!savedPass) {
                localStorage.setItem(`${userId}_pass`, passInput);
                savedPass = passInput;
            } else if (savedPass !== passInput) {
                alert("كلمة السر خاطئة!");
                return;
            }

            if (!proofInput) {
                alert("اكتب دليل المذاكرة أولاً!");
                return;
            }

            const today = getToday();
            let currentStreak = parseInt(localStorage.getItem(`${userId}_streak`) || "0");

            localStorage.setItem(`${userId}_streak`, currentStreak + 1);
            localStorage.setItem(`${userId}_last_date`, today);
            localStorage.setItem(`${userId}_proof_${today}`, proofInput);

            alert("كفو! تم تسجيل المذاكرة واحتساب الـ Streak 🔥");
            renderUI();
        }

        // عداد منتصف الليل (الساعة 12)
        function startMidnightTimer() {
            function update() {
                const now = new Date();
                const midnight = new Date();
                midnight.setHours(24, 0, 0, 0);

                const diff = midnight - now;
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById("timer").innerText = 
                    `الوقت المتبقي لانتهاء اليوم: ${hours}س : ${mins}د : ${secs}ث`;
            }
            update();
            setInterval(update, 1000);
        }

        startMidnightTimer();
        renderUI();
    </script>
</body>
</html>
